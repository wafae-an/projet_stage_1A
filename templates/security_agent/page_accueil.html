{% load static %}
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Espace Agent</title>
    <link rel="stylesheet" href="{% static 'css/Agent/style.css' %}">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
        
    
    <style>
         body {
      font-family: "Roboto", sans-serif;
      font-weight: 400;
      font-style: normal;
    }
    
                  
       .card button {
    background-color: #04233b;
    color: white;
    border: none;
    padding: 0.75rem 1.5rem;
    border-radius: 5px;
    cursor: pointer;
    font-size: 1rem;
    transition: background-color 0.3s ease, transform 0.3s ease;
}

.card button:hover {
    background-color:#04233b ;
    transform: translateY(-2px);
}
  
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .header .logo img {
            width: 100px;
        }
        
        .header .nav-icons {
            display: flex;
            align-items: center;
        }

        .header .nav-icons .nav-link {
            margin-left: 20px;
            color: black;
        }
        
        .header .profile {
            display: flex;
            align-items: center;
        }
        
        .header .profile img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            margin-right: 10px;
        }
        
        .header .profile .name {
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <header class="header">
        <div class="logo">
            <a class="navbar-brand" href="index.html">
                <img src="{% static 'img/img.png' %}" alt="logo">
            </a>
        </div>
        <div class="nav-icons">
            <a class="nav-link" href="{% url 'profile_agent' %}">
                <span class="material-symbols-outlined">manage_accounts</span>
            </a>
            <a class="nav-link" href="{% url 'logoutc' %}">
                <span class="material-symbols-outlined">logout</span>
            </a>
        </div>
    </header>
   
    <!-- Main Content -->
    <div class="container">
        <div class="card">
            <h2>Ajouter une réclamation</h2>
            <button onclick="navigateToAddClaim()">Ajouter</button>
        </div>
        <div class="card">
            <h2>Modifier ou supprimer une réclamation</h2>
            <button onclick="navigateToEditDeleteClaim()">Modifier ou Supprimer</button>
        </div>
    </div>

    <!-- JavaScript -->
    <script>
        function navigateToAddClaim() {
            window.location.href = "{% url 'add_claim' %}";
        }

        function navigateToEditDeleteClaim() {
            window.location.href = "{% url 'edit_delete_claim' %}";
        }

        function logout() {
            window.location.href = "{% url 'login_Employee' %}";
        }

        function navigateToProfile() {
            window.location.href = "{% url 'profile' %}";
        }
    </script>
</body>
</html>
