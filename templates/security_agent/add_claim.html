{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <link href="https://fonts.googleapis.com/css?family=Roboto:400,700,900&display=swap" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{% static 'css/Agent/css/bootstrap.min.css' %}">
    
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
    <title>Contact Form #9</title>
</head>
<style>
    body {
  background-color: #fff;
  line-height: 1.9;
  color: #000000;
  position: relative;
  font-family: "Roboto", sans-serif;
  font-weight: 400;
  font-style: normal;
 }

h1, h2, h3, h4, h5, h6,
.h1, .h2, .h3, .h4, .h5, .h6 {
  color: #000; }

a {
  -webkit-transition: .3s all ease;
  -o-transition: .3s all ease;
  transition: .3s all ease; }
  a, a:hover {
    text-decoration: none !important; }

.text-black {
  color: #000; }

.content {
  padding: 7rem 0; }

.heading {
  font-size: 2.5rem;
  font-weight: 900; }

.form-control {
  border: none;
  border-bottom: 1px solid #ccc;
  padding-left: 0;
  padding-right: 0;
  border-radius: 0;
  background: none; }
  .form-control:active, .form-control:focus {
    outline: none;
    -webkit-box-shadow: none;
    box-shadow: none;
    border-color: #000; }

.col-form-label {
  color: #000;
  font-size: 13px; }

.btn, .form-control, .custom-select {
  height: 45px;
  border-radius: 0; }

.custom-select {
  border: none;
  border-bottom: 1px solid #ccc;
  padding-left: 0;
  padding-right: 0;
  border-radius: 0; }
  .custom-select:active, .custom-select:focus {
    outline: none;
    -webkit-box-shadow: none;
    box-shadow: none;
    border-color: #000; }

.btn {
  border: none;
  border-radius: 0;
  font-size: 11px;
  letter-spacing: .2rem;
  text-transform: uppercase;
  border-radius: 30px !important; }
  .btn.btn-primary {
    border-radius: 30px;
    background: #04233b;
    color: #fff;
    -webkit-box-shadow: 0 15px 30px 0 rgba(163, 139, 138, 0.2);
    box-shadow: 0 15px 30px 0 rgba(163, 139, 138, 0.2); }
  .btn:hover {
    color: #fff; }
  .btn:active, .btn:focus {
    outline: none;
    -webkit-box-shadow: none;
    box-shadow: none; }

.contact-wrap {
  -webkit-box-shadow: 0 0px 20px 0 rgba(0, 0, 0, 0.05);
  box-shadow: 0 0px 20px 0 rgba(0, 0, 0, 0.05);
  border: 1px solid #efefef; }
  .contact-wrap .col-form-label {
    font-size: 14px;
    color: #000000;
    margin: 0 0 10px 0;
    display: inline-block;
    padding: 0; }
  .contact-wrap .form, .contact-wrap .contact-info {
    padding: 40px; }
  .contact-wrap .contact-info {
    color: rgba(0, 0, 0, 0.5); }
    .contact-wrap .contact-info ul li {
      margin-bottom: 15px;
      color: rgba(0, 0, 0, 0.5); }
      .contact-wrap .contact-info ul li .wrap-icon {
        font-size: 20px;
        color: #fff;
        margin-top: 5px; }
  .contact-wrap .form {
    background: #fff; }
    .contact-wrap .form h3 {
      color: #000;
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 30px; }
  .contact-wrap .contact-info {
    height: 100vh;
    background-size: cover;
    background-position: center center;
    background-repeat: no-repeat; }
    .contact-wrap .contact-info a {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0; }
    @media (max-width: 1199.98px) {
      .contact-wrap .contact-info {
        height: 400px !important; } }
    .contact-wrap .contact-info h3 {
      color: #fff;
      font-size: 20px;
      margin-bottom: 30px; }

label.error {
  font-size: 12px;
  color: #04233b; }

#message {
  resize: vertical; }

#form-message-warning, #form-message-success {
  display: none; }

#form-message-warning {
  color:#04233b; }

#form-message-success {
  color: #04233b;
  font-size: 18px;
  font-weight: bold; }

.submitting {
  float: left;
  width: 100%;
  padding: 10px 0;
  display: none;
  font-weight: bold;
  font-size: 12px;
  color: #000; }

    .roboto-regular {
        font-family: "Roboto", sans-serif;
        font-weight: 400;
        font-style: normal;
    }

    .nav-bar-bottom-right {
        position: fixed;
        bottom: 17px;
        right: 10px;
    }

    .nav-link-button {
        display: inline-block;
        padding: .375rem .75rem;
        font-size: 1rem;
        font-weight: 400;
        line-height: 1.5;
        color: #fff;
        background-color: #04233b;
        border: 1px solid transparent;
        border-radius: .25rem;
        text-align: center;
        vertical-align: middle;
        user-select: none;
        transition: color .15s ease-in-out, background-color .15s ease-in-out, border-color .15s ease-in-out, box-shadow .15s ease-in-out;
    }

    .nav-link-button:hover {
        background-color: #04233b;
        color: #fff;
        text-decoration: none;
    }
</style>
<body>
    <div class="header">
        <img src="{% static 'img/img.png' %}" alt="logo" style="height: auto;width: 100px;">
    </div>
    <div class="content">
        <div class="container">
            <div class="row align-items-stretch no-gutters contact-wrap">
                <div class="col-md-12">
                    <div class="form h-100">
                        {% if messages %}
                        <div class="messages">
                            {% for message in messages %}
                            <div class="alert {% if message.tags %}alert-{{ message.tags }}{% else %}alert-info{% endif %}" role="alert">
                                {{ message }}
                            </div>
                            {% endfor %}
                        </div>
                        {% endif %}
                        <form class="mb-5" method="post" id="contactForm" name="contactForm" enctype="multipart/form-data" action="{% url 'add_claim' %}">
                            {% csrf_token %}
                            <div class="row">
                                <div class="col-md-6 form-group mb-3">
                                    <label for="name" class="col-form-label">Name *</label>
                                    <input type="text" class="form-control" name="citizen_name" id="name" placeholder="Citizen name">
                                </div>
                                <div class="col-md-6 form-group mb-3">
                                    <label for="email" class="col-form-label">Email *</label>
                                    <input type="text" class="form-control" name="citizen_email" id="email" placeholder="Citizen email">
                                </div>
                                <div class="col-md-6 form-group mb-3">
                                    <label for="phone" class="col-form-label">Phone *</label>
                                    <input type="text" class="form-control" name="citizen_contact" id="phone" placeholder="Citizen phone number">
                                </div>
                                <div class="col-md-6 form-group mb-3">
                                    <label for="CIN" class="col-form-label">CIN*</label>
                                    <input type="text" class="form-control" name="CIN" id="CIN" placeholder="ID CARD number">
                                </div>  
                                <div class="col-md-6 form-group mb-3">
                                  <label for="numero" class="col-form-label">Address *</label>
                                  <input type="text" class="form-control" name="citizen_adresse" id="address" placeholder="Citizen full address">
                              </div>  
                              
                                
                                <div class="col-md-12 form-group mb-3">
                                    <label for="claim_type" class="col-form-label">Type of claim *</label>
                                    <select class="custom-select" id="claim_type" name="claim_type">
                                        <option selected>Choose...</option>
                                        {% for claim_type in claim_types %}
                                        <option value="{{ claim_type.name }}">{{ claim_type.name }}</option>
                                        {% endfor %}
                                    </select>
                                </div>
                                <div class="col-md-12 form-group mb-3">
                                  <label for="description" class="col-form-label">description*</label>
                                  <input type="text" class="form-control" name="description" id="description" placeholder="claim description">
                              </div>
                                
                                <div class="col-md-12 form-group">
                                    <input type="submit" value="SUBMIT CITIZEN CLAIM" class="btn btn-primary rounded-0 py-2 px-4">
                                    <span class="submitting"></span>
                                </div>
                                <!-- Nouveau bouton de navigation ici -->
                                <div class="col-md-12 form-group" >
                                    <a href="{% url 'edit_delete_claim' %}" class="btn btn-primary rounded-0 py-2 px-4"  >edit or delete a claim → </a>
                                </div>
                            </div>
                        </form>
                        <div id="form-message-warning mt-4"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
