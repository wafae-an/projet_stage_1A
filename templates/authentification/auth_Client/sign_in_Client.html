{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Login Form for client</title>

   <!-- custom css file link  -->
   <link rel="stylesheet" href="{% static 'css/authClient/style.css' %}">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
   <style>
       body
        {
          font-family: "Roboto", sans-serif;
          font-weight: 400;
          font-style: normal;
      }
   </style>

</head>
<body>
    <header>
        <img src="{% static 'img/img.png' %}" class="logo" style="height: auto; width: 100px;">
    </header>
   
<div class="form-container">

   <form action="{% url 'login_client' %}" method="post">
      {% csrf_token %}
      <h3>Login Now</h3>
      
      {% if messages %}
      {% for message in messages %}
         <div class="alert alert-{{ message.tags }}">
            {{ message }}
         </div>
      {% endfor %}
      {% endif %}

      <input type="text" name="username" required placeholder="Enter your username" required>
      <input type="password" name="password" required placeholder="Enter your password" required>
      <input type="submit" name="submit" value="Login Now" class="form-btn">
      <p>Don't have an account? <a href="{% url 'register_client' %}">Register now</a></p>
   </form>

</div>

</body>
</html>
