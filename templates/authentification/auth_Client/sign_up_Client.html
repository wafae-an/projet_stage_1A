{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta http-equiv="X-UA-Compatible" content="IE=edge">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>register form</title>

   <!-- custom css file link  -->
   <link rel="stylesheet" href="{% static 'css/authClient/style.css' %}">
   <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
   <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&display=swap" rel="stylesheet">
   <style>
       body {
          font-family: "Roboto", sans-serif;
          font-weight: 400;
          font-style: normal;
      }
   </style>


</head>
<body>
    <header>
        <img src="{% static 'img/img.png' %}" class="logo" style="height: auto; width: 100px;">
    </header>
   
   
<div class="form-container">
   {% for msg in messages %}
       {{ msg }}

   {% endfor %}
   
   <form action="{% url 'register_client' %}" method="post">
       {% csrf_token %}
      <h3>register now</h3>

      <input type="name" name="name" required placeholder="enter your name">
      <input type="text" name="username" required placeholder="enter your username">
      <input type="email" name="email" required placeholder="enter your email">
      <input type="password" name="password" required placeholder="enter your password">
      <input type="password" name="repassword" required placeholder="confirm your password">
      <input type="submit" name="submit" value="register now" class="form-btn">
      <p>already have an account? <a href="{% url 'login_client' %}">login now</a></p>
   </form>

</div>

</body>
</html>
