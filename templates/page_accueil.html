button {

    color: #fff;
    cursor: pointer;
    position: relative;

}

button span {
    background: white;
    height: 100%;
    width: 0;
    border-radius: 25px;
    position: absolute;
    left: 0;
    bottom: 0;
    z-index: -1;

button:hover span {

button:hover {
